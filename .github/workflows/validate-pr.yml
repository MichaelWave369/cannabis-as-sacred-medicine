name: Validate Sacred Medicine PR

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Verify Cannabiverse feed contract
        run: npm run check:oncology
      - name: Verify research bridge v2
        run: npm run check:bridge
      - name: Verify Pain & ECS domain integration
        run: npm run check:pain-ecs
      - name: Verify ECS Network Atlas read-only consumer
        run: npm run check:ecs-network
      - name: Verify archaeology domain integration
        run: npm run check:archaeology
      - name: Build React navigator
        run: npm run build
